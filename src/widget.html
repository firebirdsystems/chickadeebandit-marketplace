<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #111827);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header { display: flex; align-items: center; gap: 6px; padding: 10px 14px 8px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .header-icon { font-size: 14px; }
    .header-title { font-size: 12px; font-weight: 600; color: var(--hub-text, #374151); flex: 1; }
    .header-link { font-size: 11px; color: #6366f1; text-decoration: none; }
    .header-link:hover { text-decoration: underline; }

    .content { flex: 1; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #9ca3af;
      text-align: center;
    }
    .empty[hidden] { display: none; }
    .empty .icon { display: block; margin-bottom: 6px; }
    .empty p { font-size: 12px; }

    .listing-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .listing-row:last-child { border-bottom: none; }

    .listing-thumb {
      width: 36px; height: 36px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--hub-bg, #f3f4f6);
    }
    /* A cutout is transparent and drawn whole, never cropped to fill. */
    .listing-thumb.cutout { object-fit: contain; }
    .listing-thumb-placeholder {
      width: 36px; height: 36px;
      border-radius: 6px;
      flex-shrink: 0;
      background: var(--hub-bg, #f3f4f6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }

    .listing-info { flex: 1; overflow: hidden; }
    .listing-title { font-weight: 500; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .listing-meta { font-size: 11px; color: #9ca3af; }

    .listing-price { font-size: 12px; font-weight: 600; color: #6366f1; white-space: nowrap; }
    .load-error { margin: 8px; padding: 8px 10px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="header">
  <span class="header-icon"></span>
  <span class="header-title">Marketplace</span>
  <a class="header-link" href="/run/marketplace">Open</a>
</div>

<div class="content" id="content">
  <div class="empty" hidden>
    <span class="icon"></span>
    <p>No listings yet</p>
  </div>
</div>

<script type="module">
import { esc, createFilesHelper, glyph, chickadee } from "/hub-sdk.js";
import { categoryGlyph, categoryLabel, formatPrice } from "./logic.js";

// The header mark and the resting empty state are static markup, drawn here
// because the glyphs come from the SDK.
document.querySelector(".header-icon").innerHTML = glyph("shop-bag");
document.querySelector(".empty .icon").innerHTML = chickadee("nest", { size: 56 });

const DB        = window.__DB_URL       ?? "";
const FILES_URL = window.__FILES_URL    ?? "";
const files     = createFilesHelper(FILES_URL);

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Couldn’t reach the hub. Try again.");
  return json;
}

async function init() {
  // Over-fetch, then drop any listing a moderator has removed. Removal lives in the
  // moderator-only `moderations` table (not listings.status, which the seller owns),
  // so a moderator-removed listing still reads status='active' and must be excluded
  // here separately. The two governed tables are read in separate statements on
  // purpose — never JOIN governed tables in one query.
  const { rows: allActive } = await db(`
    SELECT id, title, price_cents, category, created_at
    FROM app_marketplace__listings
    WHERE status = 'active'
    ORDER BY created_at DESC
    LIMIT 25
  `);
  if (!allActive.length) return;

  const { rows: removed } = await db(`SELECT listing_id FROM app_marketplace__moderations`);
  const removedSet = new Set((removed ?? []).map(r => r.listing_id));
  const listings = allActive.filter(l => !removedSet.has(l.id)).slice(0, 5);
  if (!listings.length) return;

  const ids = listings.map(l => l.id);
  const { rows: photos } = await db(`
    SELECT listing_id, file_id, thumb_file_id, cutout_file_id, cutout_thumb_file_id
    FROM app_marketplace__listing_photos
    WHERE listing_id IN (${ids.map(() => "?").join(",")})
      AND position = 0
  `, ids);
  const photoByListing = new Map(photos.map(p => [p.listing_id, p]));

  const content = document.getElementById("content");
  content.innerHTML = listings.map(l => {
    const photo = photoByListing.get(l.id);
    const thumb = photo
      ? `<img class="listing-thumb${photo.cutout_file_id ? " cutout" : ""}" src="${files.url(photo.cutout_file_id ? photo.cutout_thumb_file_id || photo.cutout_file_id : photo.thumb_file_id || photo.file_id)}" alt="" loading="lazy" />`
      : `<div class="listing-thumb-placeholder">${glyph(categoryGlyph(l.category))}</div>`;
    return `
      <div class="listing-row">
        ${thumb}
        <div class="listing-info">
          <div class="listing-title">${esc(l.title)}</div>
          <div class="listing-meta">${glyph(categoryGlyph(l.category))} ${esc(categoryLabel(l.category))}</div>
        </div>
        <span class="listing-price">${esc(formatPrice(l.price_cents))}</span>
      </div>
    `;
  }).join("");
}

init().then(() => {
  // The resting empty state is hidden until the first read settles: the tile
  // must not say "none" before it knows. Content, if any, has replaced it.
  const empty = document.querySelector("#content .empty");
  if (empty) empty.hidden = false;
}).catch(() => {
  // In place of the resting "No listings yet", which would be a guess.
  document.getElementById("content").innerHTML = `<div class="load-error" data-testid="load-error" role="alert">Couldn’t load the listings.</div>`;
});
</script>
<script type="module">
  // A link to this app opens it through the hub. Followed in place it loaded
  // the whole app inside this tile: the Home grid's sandbox cannot move the
  // hub page. The query goes along as the app's launch params.
  import { hubOpen } from "/hub-sdk.js";
  document.addEventListener("click", (e) => {
    const a = e.target.closest?.('a[href^="/run/"]');
    // Already sent by the hub's own link handler (it runs first, on capture).
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const url = new URL(a.href);
    const app = /^\/run\/([a-z0-9_-]+)$/i.exec(url.pathname);
    if (!app) return;
    e.preventDefault();
    hubOpen(app[1], Object.fromEntries(url.searchParams));
  });
</script>
</body>
</html>
